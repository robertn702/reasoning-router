name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes and create releases
      pull-requests: write # open the version PR
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
